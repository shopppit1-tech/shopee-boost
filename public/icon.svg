<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#D0011B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with squircle safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Main Shopping Bag Icon inside safe zone -->
  <g filter="url(#shadow)">
    <!-- Bag Handle -->
    <path d="M196 170 C196 116, 316 116, 316 170" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Bag Body -->
    <path d="M140 180 L372 180 L394 380 C396 398, 382 414, 364 414 L148 414 C130 414, 116 398, 118 380 Z" fill="#FFFFFF"/>
    
    <!-- Boost Lightning / Sparkle on bag -->
    <path d="M266 210 L220 294 L258 294 L244 374 L302 284 L264 284 Z" fill="#EE4D2D"/>
  </g>
</svg>
